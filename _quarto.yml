project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - schedule.qmd
    - assessment.qmd
    - assignments.qmd
    - labs.qmd
    - resources.qmd
    - feedback.qmd
    - code/index.qmd
    - labs/*.md
    - lectures.qmd
    - projects.qmd
    - lectures/index.qmd
    - projects/index.qmd
    - feedback/index.qmd
  resources:
    - "lectures/*.pdf"
    - "hw/*.pdf"
    - "exams/*.pdf"
    - "labs/*.pdf"
    - "code/**"

website:
  title: "CS 301 · Operating Systems"
  favicon: favicon.svg
  description: "Operating Systems at IIT Gandhinagar, Semester I 2018–19"
  site-url: https://nipunbatra.github.io/os2018/
  search: false
  google-analytics: "UA-96903131-1"

format:
  html:
    theme: [cosmo, styles.scss, course.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    body-classes: dl
    link-external-newwindow: true
    include-in-header: course-theme.html
    include-before-body: rail.html
    include-after-body: course-tools.html

execute:
  freeze: auto
